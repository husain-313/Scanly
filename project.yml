name: Scanly
options:
  bundleIdPrefix: com.scanly.personal
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Manual
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGNING_ALLOWED: "NO"
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    ENABLE_USER_SCRIPT_SANDBOXING: "YES"

targets:
  Scanly:
    type: application
    platform: iOS
    sources:
      - path: Scanly
    settings:
      base:
        INFOPLIST_FILE: Scanly/Resources/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.scanly.personal
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: "NO"
        ENABLE_BITCODE: "NO"
    entitlements:
      path: Scanly/Resources/Scanly.entitlements
      properties: {}
