name: Build IPA

on:
  push:
    branches: [ main ]
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Use the newest stable Xcode
        run: |
          ls -d /Applications/Xcode*.app || true
          XCODE=$(ls -d /Applications/Xcode_*.app 2>/dev/null | grep -Evi 'beta|release_candidate|_rc' | sort -V | tail -1)
          if [ -n "$XCODE" ]; then sudo xcode-select -s "$XCODE"; fi
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project Scanly.xcodeproj \
            -scheme Scanly \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            clean build 2>&1 | tee build.log || {
              grep -E "error:" build.log | sort -u | head -20 | while IFS= read -r line; do
                echo "::error::${line}"
              done
              exit 1
            }

      - name: Package IPA
        run: |
          set -e
          APP="build/Build/Products/Release-iphoneos/Scanly.app"
          mkdir -p Payload
          cp -R "$APP" Payload/
          codesign --force --sign - --entitlements Scanly/Resources/Scanly.entitlements Payload/Scanly.app || true
          zip -qry Scanly.ipa Payload
          ls -lh Scanly.ipa

      - name: Upload IPA (Actions)
        uses: actions/upload-artifact@v4
        with:
          name: Scanly-ipa
          path: Scanly.ipa
          if-no-files-found: error

      - name: Publish release with the IPA
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Scanly (build ${{ github.run_number }})
          body: |
            Unsigned IPA. Install with Sideloadly, AltStore or a similar signing tool.
            iPhone and iPad, iOS 17 or later.
          files: Scanly.ipa
          make_latest: true
